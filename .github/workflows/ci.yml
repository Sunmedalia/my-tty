name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: format
        run: zig fmt --check build.zig src/*.zig web/embed.zig
      - name: script syntax
        run: |
          node --check web/app.js
          for f in tests/browser/*.cjs scripts/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: build
        run: zig build
      - name: test
        run: zig test src/tests.zig
      - name: smoke
        run: ./scripts/smoke.sh
      - name: release build
        run: ./scripts/build-release.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: cache playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: install browser deps
        working-directory: tests/browser
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: browser tests
        run: ./scripts/browser_test.sh
