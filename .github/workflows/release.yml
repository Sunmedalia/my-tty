name: release

# 打 v* tag 时自动构建多架构包并发布。也可以在 Actions 里对某个 tag 手动触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            arch: x86_64
          - target: aarch64-linux
            arch: aarch64
            qemu: aarch64
          - target: arm-linux-musleabihf
            arch: armv7
            qemu: arm
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: build
        run: ./scripts/build-release.sh ${{ matrix.target }}
      - name: runtime check under qemu
        if: matrix.qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          qemu-${{ matrix.qemu }}-static ./zig-out/bin/my-tty --check-config
      - name: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pkg="my-tty-${version}-${{ matrix.arch }}"
          mkdir -p "dist/$pkg/deploy"
          cp zig-out/bin/my-tty "dist/$pkg/"
          cp README.md README.en.md my-tty.example.json "dist/$pkg/"
          cp deploy/my-tty.service "dist/$pkg/deploy/"
          tar -C dist -czf "dist/$pkg-linux.tar.gz" "$pkg"
          ( cd dist && sha256sum "$pkg-linux.tar.gz" > "$pkg-linux.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require a tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "release workflow must run on a v* tag, got $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c --strict ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l
          version="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/${version}/g" ../.github/release-notes.md > ../release-body.md
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS \
            --title "my-tty $GITHUB_REF_NAME" --notes-file ../release-body.md
