name: release

# 打 v* tag 时自动构建多架构包并发布；也可以在 Actions 里对已有 tag 手动触发
# （选 main 分支运行，tag 填 v0.1.0，构建的仍是该 tag 的代码）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            arch: x86_64
          - target: aarch64-linux
            arch: aarch64
            platform: linux/arm64
          - target: arm-linux-musleabihf
            arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: build
        run: ./scripts/build-release.sh ${{ matrix.target }}
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform
        with:
          platforms: all
      - name: runtime check under qemu
        if: matrix.platform
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/w" -w /w alpine:3.20 /w/zig-out/bin/my-tty --check-config
      - name: package
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pkg="my-tty-${version}-${{ matrix.arch }}"
          mkdir -p "dist/$pkg/deploy"
          cp zig-out/bin/my-tty "dist/$pkg/"
          cp README.md README.en.md my-tty.example.json "dist/$pkg/"
          cp deploy/my-tty.service "dist/$pkg/deploy/"
          tar -C dist -czf "dist/$pkg-linux.tar.gz" "$pkg"
          ( cd dist && sha256sum "$pkg-linux.tar.gz" > "$pkg-linux.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 这个 job 用当前分支（手动触发时是 main）的 release notes 模板，
      # 不跟着 tag 走；tag 只用 API 校验存在。
      - uses: actions/checkout@v4
      - name: check tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "release tag must look like v0.1.0, got '$RELEASE_TAG'" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c --strict ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l
          version="${RELEASE_TAG#v}"
          sed "s/@VERSION@/${version}/g" ../.github/release-notes.md > ../release-body.md
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --title "my-tty $RELEASE_TAG" --notes-file ../release-body.md
