<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>my-tty</title>
    <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <span class="brand">my-tty</span>
        <span id="status"></span>
        <span class="spacer"></span>
        <span id="hint">Ctrl+C 复制选中 / 中断 · Ctrl+V 粘贴 · Ctrl+Shift+F 查找</span>
        <button id="send-interrupt" class="icon" type="button" title="发送 Ctrl+C（中断，适用于 RDP 等 Ctrl 不可用的环境）">^C</button>
        <button id="font-dec" class="icon" type="button" title="缩小字号">A−</button>
        <button id="font-inc" class="icon" type="button" title="放大字号">A+</button>
        <button id="toggle-files" type="button" title="文件">文件</button>
        <button id="add-pane" type="button" title="新建分屏">+ 分屏</button>
        <button id="logout" type="button" title="注销">注销</button>
      </header>

      <div id="main">
        <div id="tabbar">
          <div id="tab-strip">
            <button id="tab-more" type="button" title="隐藏的标签页" hidden>⋯</button>
            <div id="tab-list" role="tablist" aria-label="终端标签页"></div>
            <button id="tab-add" type="button" title="新建标签页">＋</button>
          </div>
          <div id="tab-menu" hidden></div>
        </div>

        <div id="find-bar" hidden>
          <input id="find-input" type="text" placeholder="在当前终端中查找…" autocomplete="off" spellcheck="false" />
          <span id="find-count"></span>
          <button id="find-prev" class="icon" type="button" title="上一个 (Shift+F3)">↑</button>
          <button id="find-next" class="icon" type="button" title="下一个 (F3)">↓</button>
          <button id="find-close" class="icon" type="button" title="关闭 (Esc)">✕</button>
        </div>

        <div id="body">
          <aside id="files" hidden>
            <div class="files-head">
              <div id="crumb"></div>
              <span class="spacer"></span>
              <button id="files-refresh" class="icon" type="button" title="刷新">⟳</button>
              <button id="files-upload" class="icon" type="button" title="上传文件（也可直接拖入）">⇪</button>
              <button id="files-new-file" class="icon" type="button" title="新建文件">＋</button>
              <button id="files-new-dir" class="icon" type="button" title="新建目录">▣</button>
            </div>
            <ul id="file-list"></ul>
            <p id="notice"></p>
            <div id="upload-progress" hidden>
              <div class="bar"><span id="uprog-fill"></span></div>
              <span id="uprog-text"></span>
              <button id="uprog-cancel" class="icon" type="button" title="取消上传">✕</button>
            </div>
            <input id="upload-input" type="file" multiple hidden />
          </aside>

          <div id="files-resize" title="拖动调整文件面板宽度" hidden></div>

          <main id="workspace" data-count="0"></main>
        </div>

        <div id="keys" aria-label="移动端快捷键">
          <button type="button" data-key="esc">Esc</button>
          <button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="ctrl">Ctrl</button>
          <button type="button" data-key="up">↑</button>
          <button type="button" data-key="down">↓</button>
          <button type="button" data-key="left">←</button>
          <button type="button" data-key="right">→</button>
          <button type="button" data-key="ctrlc">^C</button>
          <button type="button" data-key="ctrld">^D</button>
          <button type="button" data-key="ctrll">^L</button>
        </div>
      </div>
    </div>

    <div id="prompt-overlay" hidden>
      <form id="prompt-form" class="prompt-card">
        <h1 id="prompt-title">新建</h1>
        <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
        <p id="prompt-error"></p>
        <div class="prompt-actions">
          <button id="prompt-cancel" type="button">取消</button>
          <button id="prompt-ok" type="submit">确定</button>
        </div>
      </form>
    </div>

    <div id="login-overlay" hidden>
      <form id="login-form" class="login-card">
        <h1>登录 my-tty</h1>
        <p class="sub">所有终端与文件功能都需要登录后使用</p>
        <input
          id="login-password"
          type="password"
          autocomplete="current-password"
          placeholder="访问密码"
          required
        />
        <p id="login-error"></p>
        <button id="login-submit" type="submit">登录</button>
        <p class="ttl">登录状态默认保持 7 天</p>
      </form>
    </div>

    <div id="editor-overlay" hidden>
      <section class="editor" role="dialog" aria-modal="true">
        <header>
          <span id="editor-path"></span>
          <span id="editor-state"></span>
          <span class="spacer"></span>
          <button id="editor-save" type="button">保存</button>
          <button id="editor-close" type="button">关闭</button>
        </header>
        <div class="editor-body">
          <pre id="editor-gutter" aria-hidden="true"></pre>
          <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <footer>Ctrl+S 保存 · Esc 关闭</footer>
      </section>
    </div>

    <script src="/vendor/xterm/xterm.js"></script>
    <script src="/vendor/xterm/addon-fit.js"></script>
    <script src="/vendor/xterm/addon-search.js"></script>
    <script src="/vendor/xterm/addon-web-links.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
